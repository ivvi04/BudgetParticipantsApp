# Реальный сервис ЕПБС. Порядок подстановки:
# %1$s = lastUpdateFrom, %2$s = lastUpdateTo, %3$s = pageNum
# pageSize фиксируем в шаблоне: 500 записей на страницу.
# При recordCount=355296 это ~711 страниц на полную выгрузку.
api.url=https://budget.gov.ru/epbs/registry/ubpandnubp/data?pageSize=500&pageNum=%3$s&filter_more_loaddate=%1$s&filter_less_loaddate=%2$s

# Формат дат для подстановки в URL (требование сервиса - dd.mm.yyyy)
api.dateFormat=dd.MM.yyyy

# Подтверждено по фактическому ответу: массив записей лежит в поле data
api.itemsKey=data

# Подтверждено по фактическому ответу: общее число страниц - pageCount
api.totalPagesKey=pageCount

db.table=denorm_data

postgres.jdbc.url=jdbc:postgresql://localhost:5433/mydb
postgres.jdbc.username=postgres
postgres.jdbc.password=postgres

# Куда складывать скачанные ответы и куда класть zip
storage.rawDir=data/raw

# Перенос в ClickHouse jdbc
clickhouse.jdbc.enabled=true
clickhouse.jdbc.url=jdbc:clickhouse://localhost:8123/default?compress=0
clickhouse.jdbc.username=default
clickhouse.jdbc.password=

# Перенос в ClickHouse http
clickhouse.http.enabled=false
clickhouse.http.url=http://localhost:8123
clickhouse.http.database=default
