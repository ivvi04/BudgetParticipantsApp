version: "3.8"

services:
  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:13 AS build
        USER root
        RUN apt-get update && apt-get install -y --no-install-recommends \
                build-essential bison flex libreadline-dev zlib1g-dev \
            && rm -rf /var/lib/apt/lists/*
        ADD https://ftp.postgresql.org/pub/source/v13.16/postgresql-13.16.tar.gz .
        RUN tar xzf postgresql-13.16.tar.gz && cd postgresql-13.16 \
            && ./configure --prefix=/usr/local/pgsql32 --with-blocksize=32 \
            && make -j"$(nproc)" && make install

        FROM postgres:13
        COPY --from=build /usr/local/pgsql32 /usr/local/pgsql32
        RUN for f in postgres psql pg_isready initdb pg_ctl; do \
                ln -sf /usr/local/pgsql32/bin/$f /usr/local/bin/$f; \
            done

    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:22.3
    ports:
      - "8123:8123"   # HTTP (использует JDBC-драйвер)
      - "9000:9000"   # Native (клиенты, не JDBC)
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

volumes:
  pgdata:
    driver: local
  chdata:
    driver: local

networks:
  app-network:
    driver: bridge
